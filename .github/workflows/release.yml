name: Release

# Distinct from CI: stages a publish to npm when a GitHub Release is published.
# Auth is npm OIDC trusted publishing (no NPM_TOKEN secret). The trusted publisher
# is configured stage-only, so this workflow STAGES the version; it does not go
# public until a maintainer approves the staged package with a 2FA challenge
# (npmjs.com "Staged Packages" tab, or `npm stage approve <stage-id>`).
# Flow: bump version + CHANGELOG -> commit -> create a Release tagged vX.Y.Z ->
# approve the staged version.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm
      # Staged + trusted publishing need npm >= 11.15.0 (Node 24.x is well past 22.14).
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - name: Verify package version matches the release tag
        if: github.event_name == 'release'
        run: |
          PKG="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::package.json version ($PKG) does not match release tag ($TAG)"
            exit 1
          fi
      # Stages the version via OIDC; provenance is signed automatically. A
      # maintainer must approve the staged package with 2FA before it is public.
      - run: npm stage publish
