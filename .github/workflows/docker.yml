name: Docker

# Builds the loopio-mcp-http image on PRs (no push, no write grants) to catch
# Dockerfile regressions. Publishing to GHCR happens in the release pipeline
# (.github/workflows/release.yml).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build (no push)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: false
          cache-from: type=gha
          # ignore-error: the GHA cache backend is occasionally flaky (503); a failed
          # cache export must not fail the build, since caching is only an optimization.
          cache-to: type=gha,mode=max,ignore-error=true
