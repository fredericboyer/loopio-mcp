name: Docker

# Builds the loopio-mcp-http image on PRs (no push, no write grants) to catch
# Dockerfile regressions. Publishing to GHCR happens in the release pipeline
# (.github/workflows/release.yml).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Build (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          cache-from: type=gha
          # ignore-error: the GHA cache backend is occasionally flaky (503); a failed
          # cache export must not fail the build, since caching is only an optimization.
          cache-to: type=gha,mode=max,ignore-error=true
